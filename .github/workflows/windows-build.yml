name: Windows Build

on:
  push:
    branches: [release/windows]
    tags: ['v*']
  pull_request:
    branches: [release/windows]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '11'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build dsh CLI
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build:lib:host

      - name: Build easybrowser bridge
        run: |
          cd native/easybrowser
          go build -o ../../dist/bridge.exe .

      - name: Build nm-host
        run: |
          cd native/easybrowser-nmhost
          go build -o ../../dist/nm-host.exe .

      - name: Build Wails desktop
        run: |
          cd apps/windows-desktop/frontend
          npm install
          npm run build
          cd ..
          wails build -clean -platform windows/amd64

      - name: Prepare dist
        shell: pwsh
        run: |
          $buildDir = "dist/windows-amd64"
          New-Item -ItemType Directory -Force -Path "$buildDir/dsh"
          Copy-Item -Recurse -Force apps/cli/lib "$buildDir/dsh/"
          Copy-Item -Force apps/cli/package.json "$buildDir/dsh/"
          Copy-Item -Force dist/bridge.exe "$buildDir/"
          Copy-Item -Force dist/nm-host.exe "$buildDir/"
          Copy-Item -Force "apps/windows-desktop/build/bin/DeepSeek Harness Setup.exe" "$buildDir/DeepSeek Harness.exe"
          Copy-Item -Recurse -Force native/easybrowser-extension "$buildDir/extension"

      - name: Build NSIS installer
        run: |
          scoop bucket add nonportable
          scoop install nsis-np
          makensis /DSourceDir="$pwd/dist/windows-amd64" /DVersion="$env:GITHUB_REF_NAME" native/windows/installer.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Setup
          path: native/windows/dist/DeepSeek-Harness-Setup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeepSeek-Harness-Setup

      - uses: softprops/action-gh-release@v2
        with:
          files: DeepSeek-Harness-Setup-*.exe
          generate_release_notes: true