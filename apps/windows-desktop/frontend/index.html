<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    #dsh-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #333;
      border-top-color: #4f8cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span>Starting DeepSeek Harness...</span>
  </div>
  <iframe id="dsh-frame" src="" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    // Get dsh URL from the Go backend
    window.runtime.Call('GetDshURL').then(url => {
      const frame = document.getElementById('dsh-frame');
      frame.src = url;
      frame.onload = () => {
        document.getElementById('loading').classList.add('hidden');
      };
    });

    // Fallback: hide loading after timeout even if iframe doesn't load
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
    }, 15000);
  </script>
</body>
</html>
